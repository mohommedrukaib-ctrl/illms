{% load ilims_tags %}
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" data-close-on-backdrop="1">
    <div class="modal modal--lg" role="document">
        <div class="modal__header">
            <h2 class="modal__title">{{ modal_title }}</h2>
            <button type="button" class="modal__close" data-close-modal>{% icon "close" "20" %}</button>
        </div>
        <form method="post" action="{% url 'core:report_generate' %}"
              hx-post="{% url 'core:report_generate' %}?modal=1"
              hx-target="#modal-host" hx-swap="innerHTML">
            {% csrf_token %}
            <input type="hidden" name="sample" value="{{ sample.pk }}">
            <div class="modal__body">
                {% if form.errors %}
                <div class="message message--error mb-md">
                    {% for f, errs in form.errors.items %}{% for e in errs %}<div>{{ f }}: {{ e }}</div>{% endfor %}{% endfor %}
                </div>
                {% endif %}
                <div class="mb-md">
                    <div class="text-xs text-muted text-uppercase">Sample</div>
                    <div class="text-semibold">{{ sample.code }} · {{ sample.client.name }}</div>
                </div>
                <div class="form-group">
                    <label class="form-label form-label--required">Safety Classification</label>
                    {{ form.safety_class }}
                </div>
                <div class="form-group">
                    <label class="form-label">Summary Notes</label>
                    {{ form.summary }}
                </div>
            </div>
            <div class="modal__footer">
                <button type="button" class="btn btn--secondary" data-close-modal>Cancel</button>
                <button type="submit" class="btn btn--primary">{% icon "check" "18" %} Generate PDF Report</button>
            </div>
        </form>
    </div>
</div>
