{% extends "base.html" %}
{% load ilims_tags %}
{% block content %}
<div class="page-header">
    <div class="page-header__left">
        <div class="page-header__icon">{% icon "report" "24" %}</div>
        <div class="page-header__text"><h1>{{ modal_title }}</h1></div>
    </div>
    <a href="{% url 'core:sample_detail' sample.pk %}" class="btn btn--secondary">← Back</a>
</div>
<div class="card max-w-lg"><div class="card__body">
    <form method="post" action="{% url 'core:report_generate' %}">
        {% csrf_token %}
        <input type="hidden" name="sample" value="{{ sample.pk }}">
        <div class="form-group"><label class="form-label form-label--required">Safety Classification</label>{{ form.safety_class }}</div>
        <div class="form-group"><label class="form-label">Summary</label>{{ form.summary }}</div>
        <button type="submit" class="btn btn--primary">Generate Report</button>
    </form>
</div></div>
{% endblock %}
