{% load ilims_tags %}
{# Theme toggle as a POST form — works with JS disabled #}
<form method="post" action="{% url 'core:theme_toggle' %}" class="theme-toggle-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit"
            class="topbar__btn"
            aria-label="Toggle {{ current_theme }} to {% if current_theme == 'light' %}dark{% else %}light{% endif %} theme"
            title="Toggle theme">
        {% if current_theme == "dark" %}
            {% icon "sun" "20" %}
        {% else %}
            {% icon "moon" "20" %}
        {% endif %}
    </button>
</form>
