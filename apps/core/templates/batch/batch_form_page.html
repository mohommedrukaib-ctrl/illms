{% extends "base.html" %}
{% load ilims_tags %}
{% block content %}
<div class="page-header">
    <div class="page-header__left">
        <div class="page-header__icon">{% icon "batch" "24" %}</div>
        <div class="page-header__text"><h1>{{ modal_title }}</h1></div>
    </div>
    <a href="{{ next_url|default:'/batches/' }}" class="btn btn--secondary">← Back</a>
</div>
<div class="card max-w-lg"><div class="card__body">
    <form method="post" action="{% url 'core:batch_create' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next_url }}">
        {% if edit_pk %}<input type="hidden" name="edit" value="{{ edit_pk }}">{% endif %}
        <div class="form-group"><label class="form-label form-label--required">Client</label>{{ form.client_name }}</div>
        <div class="d-grid gap-md" style="grid-template-columns:1fr 1fr;">
            <div class="form-group"><label class="form-label form-label--required">Lot Number</label>{{ form.batch_number }}</div>
            <div class="form-group"><label class="form-label">Product</label>{{ form.product_name }}</div>
        </div>
        <div class="d-grid gap-md" style="grid-template-columns:1fr 1fr;">
            <div class="form-group"><label class="form-label">Production Date</label>{{ form.production_date }}</div>
            <div class="form-group"><label class="form-label">Expiry Date</label>{{ form.expiry_date }}</div>
        </div>
        <button type="submit" class="btn btn--primary">Save Batch</button>
    </form>
</div></div>
{% endblock %}
