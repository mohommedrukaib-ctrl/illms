{% load ilims_tags %}
<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" data-close-on-backdrop="1">
    <div class="modal" role="document">
        <div class="modal__header">
            <h2 class="modal__title">{{ modal_title|default:"Update Status" }}</h2>
            <button type="button" class="modal__close" aria-label="Close modal" onclick="document.getElementById('modal-host').innerHTML='';">
                {% icon "close" "20" %}
            </button>
        </div>

        <form method="post" action="{% url 'core:sample_advance' sample.pk %}" hx-post="{% url 'core:sample_advance' sample.pk %}?modal=1" hx-target="#modal-host" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal__body">
                <div class="form-group">
                    <label class="form-label form-label--required">New Status</label>
                    {{ form.to_status }}
                </div>
                <div class="form-group">
                    <label class="form-label">Transition Notes (Optional)</label>
                    {{ form.notes }}
                </div>
            </div>
            <div class="modal__footer">
                <button type="button" class="btn btn--secondary" onclick="document.getElementById('modal-host').innerHTML='';">Cancel</button>
                <button type="submit" class="btn btn--primary">Update Status</button>
            </div>
        </form>
    </div>
</div>
